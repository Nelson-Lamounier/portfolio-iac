# @format

name: "Setup CDK Deployment Environment"
description: "Sets up complete environment for CDK deployment including AWS credentials and build cache"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  aws-role:
    description: "AWS IAM role ARN for OIDC authentication"
    required: true
  aws-region:
    description: "AWS region for deployment"
    required: true
  build-cache-key:
    description: "Build cache key from build job"
    required: true
  environment-name:
    description: "Environment name for deployment"
    required: false
    default: "pipeline"

runs:
  using: "composite"
  steps:
    - name: Setup Infrastructure Environment
      uses: ./.github/actions/setup-infrastructure
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore Build Cache
      uses: actions/cache@v4
      with:
        path: |
          infrastructure/dist
          infrastructure/cdk.out
          node_modules
        key: ${{ inputs.build-cache-key }}
        fail-on-cache-miss: true

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}

    - name: Verify Environment Setup
      shell: bash
      run: |
        echo "✅ Environment Setup Complete"
        echo "Node.js: $(node --version)"
        echo "Yarn: $(yarn --version)"
        echo "AWS CLI: $(aws --version)"
        echo "CDK: $(cd infrastructure && yarn cdk --version)"
        echo "Environment: ${{ inputs.environment-name }}"
