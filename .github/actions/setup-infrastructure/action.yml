# @format

name: "Setup Infrastructure Environment"
description: "Sets up Node.js, Corepack, dependencies, and caching for infrastructure deployment"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  cache-key:
    description: "Cache key for build artifacts"
    required: false
    default: ""

outputs:
  cache-hit:
    description: "Whether cache was hit"
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Turbo Cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Cache Dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          infrastructure/node_modules
        key: ${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock', '**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Install Dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --immutable
