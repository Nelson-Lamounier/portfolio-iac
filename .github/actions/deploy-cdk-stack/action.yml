# @format

name: "Deploy CDK Stack"
description: "Deploys a CDK stack with environment validation and error handling"

inputs:
  stack-name:
    description: "Name of the CDK stack to deploy"
    required: true
  environment:
    description: "Environment name (e.g., pipeline, development, production)"
    required: true
  aws-account-id:
    description: "AWS Account ID for deployment"
    required: true
  aws-region:
    description: "AWS Region for deployment"
    required: true
  dev-vpc-id:
    description: "Development VPC ID (optional)"
    required: false
    default: ""
  dev-account-id:
    description: "Development Account ID (optional)"
    required: false
    default: ""
  additional-args:
    description: "Additional CDK deploy arguments"
    required: false
    default: "--require-approval never"

outputs:
  deployment-status:
    description: "Status of the deployment (success/failure)"
    value: ${{ steps.deploy.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Validate Environment Variables
      shell: bash
      run: |
        echo "🔍 Validating deployment environment for ${{ inputs.stack-name }}..."
        echo ""

        # Track validation errors
        VALIDATION_ERRORS=0

        # Verify required environment variables
        if [ -z "${{ inputs.aws-account-id }}" ]; then
          echo "CRITICAL ERROR: AWS Account ID is not set"
          echo ""
          echo "Troubleshooting Steps:"
          echo "  1. Check if the 'validate-setup' job completed successfully"
          echo "  2. Verify AWS OIDC role configuration in repository secrets"
          echo "  3. Ensure AWS credentials are properly configured"
          echo "  4. Check if 'determine-jobs' enabled validate-setup job"
          echo ""
          echo "Related Jobs to Check:"
          echo "  - determine-jobs: Job selection logic"
          echo "  - validate-setup: AWS account ID retrieval"
          echo ""
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi

        if [ -z "${{ inputs.environment }}" ]; then
          echo "❌ CRITICAL ERROR: Environment is not set"
          echo ""
          echo "📋 Expected Values: pipeline, development, staging, production"
          echo "🔗 Check: Composite action input parameters"
          echo ""
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi

        if [ -z "${{ inputs.stack-name }}" ]; then
          echo "CRITICAL ERROR: Stack name is not set"
          echo ""
          echo "📋 Expected Format: [StackName]-[environment]"
          echo "🔗 Check: Composite action input parameters"
          echo ""
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi

        if [ -z "${{ inputs.aws-region }}" ]; then
          echo "CRITICAL ERROR: AWS Region is not set"
          echo ""
          echo "Expected Values: eu-west-1, us-east-1, etc."
          echo "Check: Environment variables and repository settings"
          echo ""
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi

        # Exit if validation errors found
        if [ $VALIDATION_ERRORS -gt 0 ]; then
          echo ""
          echo "DEPLOYMENT BLOCKED: $VALIDATION_ERRORS validation error(s) found"
          echo ""
          echo "IMMEDIATE ACTIONS REQUIRED:"
          echo "  1. Review the error messages above"
          echo "  2. Check the 'validate-setup' job logs"
          echo "  3. Verify repository secrets and variables"
          echo "  4. Ensure proper job dependencies in workflow"
          echo ""
          echo "Need Help?"
          echo "  - Check docs/troubleshooting/ for common issues"
          echo "  - Review previous successful runs for comparison"
          echo "  - Verify AWS account permissions and OIDC configuration"
          exit 1
        fi

        echo "Environment validation passed successfully"
        echo ""
        echo "Deployment Configuration:"
        echo "  Stack Name: ${{ inputs.stack-name }}"
        echo "  Environment: ${{ inputs.environment }}"
        echo "  AWS Region: ${{ inputs.aws-region }}"
        echo "  Account ID: ***MASKED*** (${#AWS_ACCOUNT_ID} characters)"
        echo "  Dev VPC ID: ${{ inputs.dev-vpc-id != '' && '***MASKED***' || 'Not configured' }}"
        echo "  Dev Account: ${{ inputs.dev-account-id != '' && '***MASKED***' || 'Not configured' }}"
        echo ""

    - name: Deploy Stack
      id: deploy
      shell: bash
      working-directory: infrastructure
      run: |
        echo "Starting deployment of ${{ inputs.stack-name }}..."
        echo ""

        # Set environment variables for CDK
        export ENVIRONMENT="${{ inputs.environment }}"
        export AWS_PIPELINE_ACCOUNT_ID="${{ inputs.aws-account-id }}"
        export AWS_REGION="${{ inputs.aws-region }}"

        # Set optional environment variables
        if [ -n "${{ inputs.dev-vpc-id }}" ]; then
          export DEV_VPC_ID="${{ inputs.dev-vpc-id }}"
          echo "Cross-account VPC configured: ***MASKED***"
        fi

        if [ -n "${{ inputs.dev-account-id }}" ]; then
          export AWS_ACCOUNT_ID_DEV="${{ inputs.dev-account-id }}"
          echo "Dev account configured: ***MASKED***"
        fi

        echo ""
        echo "CDK Deployment Command:"
        echo "  yarn cdk deploy ${{ inputs.stack-name }} ${{ inputs.additional-args }}"
        echo ""

        # Pre-deployment checks
        echo "Pre-deployment validation..."

        # Check if CDK is available via yarn
        if ! yarn cdk --version &> /dev/null; then
          echo "CDK CLI not found via yarn"
          echo ""
          echo "DEPLOYMENT FAILED: CDK CLI Missing"
          echo ""
          echo "Troubleshooting Steps:"
          echo "  1. Check if 'setup-cdk-deployment' composite action ran successfully"
          echo "  2. Verify Node.js and dependencies are properly installed"
          echo "  3. Check build cache restoration"
          echo "  4. Ensure CDK is installed in infrastructure workspace"
          echo ""
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi

        # Check if stack exists in CDK app
        echo "Checking if stack exists in CDK application..."
        if ! yarn cdk list | grep -q "${{ inputs.stack-name }}"; then
          echo "Stack '${{ inputs.stack-name }}' not found in CDK application"
          echo ""
          echo "DEPLOYMENT FAILED: Stack Not Found"
          echo ""
          echo "Available Stacks:"
          yarn cdk list | sed 's/^/    /'
          echo ""
          echo "Possible Issues:"
          echo "  1. Stack name mismatch (check environment suffix)"
          echo "  2. Stack not properly exported in CDK app"
          echo "  3. Environment configuration issues"
          echo "  4. CDK synthesis errors"
          echo ""
          echo "Quick Fixes:"
          echo "  1. Verify stack name format: [StackName]-${{ inputs.environment }}"
          echo "  2. Check infrastructure/bin/app.ts for stack definitions"
          echo "  3. Run 'yarn cdk synth' locally to test"
          echo ""
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi

        echo "Stack found in CDK application"
        echo ""

        # Deploy the stack with enhanced error handling
        echo "Executing CDK deployment..."
        echo "⏱Started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo ""

        if yarn cdk deploy "${{ inputs.stack-name }}" ${{ inputs.additional-args }}; then
          echo ""
          echo "DEPLOYMENT SUCCESSFUL"
          echo "⏱Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Stack: ${{ inputs.stack-name }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Region: ${{ inputs.aws-region }}"
          echo ""
          echo "status=success" >> $GITHUB_OUTPUT
        else
          DEPLOY_EXIT_CODE=$?
          echo ""
          echo "❌ DEPLOYMENT FAILED"
          echo "⏱️  Failed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🔢 Exit Code: $DEPLOY_EXIT_CODE"
          echo ""
          echo "🚨 COMMON DEPLOYMENT FAILURE CAUSES:"
          echo ""
          echo "1️⃣  RESOURCE CONFLICTS:"
          echo "   - Duplicate resource names"
          echo "   - CloudFormation export conflicts"
          echo "   - Resource limits exceeded"
          echo ""
          echo "2️⃣  PERMISSION ISSUES:"
          echo "   - Insufficient IAM permissions"
          echo "   - Cross-account access problems"
          echo "   - Service-linked role missing"
          echo ""
          echo "3️⃣  CONFIGURATION ERRORS:"
          echo "   - Invalid parameter values"
          echo "   - Missing dependencies"
          echo "   - Environment variable issues"
          echo ""
          echo "4️⃣  INFRASTRUCTURE LIMITS:"
          echo "   - VPC limits reached"
          echo "   - EIP allocation failures"
          echo "   - Service quotas exceeded"
          echo ""
          echo "🔧 IMMEDIATE TROUBLESHOOTING STEPS:"
          echo ""
          echo "1. Check CloudFormation console for detailed error messages"
          echo "2. Review CDK diff to see what changes are being applied"
          echo "3. Verify all required resources exist and are accessible"
          echo "4. Check AWS service health dashboard"
          echo "5. Review previous successful deployments for differences"
          echo ""
          echo "💡 DEBUGGING COMMANDS:"
          echo "   yarn cdk diff ${{ inputs.stack-name }}  # See changes"
          echo "   yarn cdk synth ${{ inputs.stack-name }} # Test synthesis"
          echo "   aws cloudformation describe-stack-events --stack-name ${{ inputs.stack-name }}"
          echo ""
          echo "📞 NEED HELP?"
          echo "   - Check docs/troubleshooting/DEPLOYMENT_ISSUES.md"
          echo "   - Review CloudFormation events in AWS Console"
          echo "   - Compare with previous successful runs"
          echo ""
          echo "status=failure" >> $GITHUB_OUTPUT
          exit $DEPLOY_EXIT_CODE
        fi
