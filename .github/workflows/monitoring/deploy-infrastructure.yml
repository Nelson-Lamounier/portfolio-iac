# @format
# Reusable workflow for deploying monitoring infrastructure

name: Deploy Monitoring Infrastructure

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string
      architecture:
        description: "Architecture type (layered/embedded)"
        required: false
        type: string
        default: "layered"
    outputs:
      alb-dns:
        description: "ALB DNS name"
        value: ${{ jobs.deploy.outputs.alb-dns }}
      cluster-name:
        description: "ECS cluster name"
        value: ${{ jobs.deploy.outputs.cluster-name }}
      instance-id:
        description: "EC2 instance ID"
        value: ${{ jobs.deploy.outputs.instance-id }}

env:
  AWS_REGION: eu-west-1
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      alb-dns: ${{ steps.get-outputs.outputs.alb-dns }}
      cluster-name: ${{ steps.get-outputs.outputs.cluster-name }}
      instance-id: ${{ steps.get-outputs.outputs.instance-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: make install

      - name: Build Infrastructure
        run: make build-infrastructure

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Monitoring Infrastructure
        run: |
          if [ "${{ inputs.architecture }}" = "layered" ]; then
            make deploy-monitoring-layered
          else
            make deploy-monitoring-embedded
          fi
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ vars.AWS_PIPELINE_ACCOUNT_ID }}
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}
          AWS_ACCOUNT_ID_STAGING: ${{ vars.AWS_ACCOUNT_ID_STAGING }}
          AWS_ACCOUNT_ID_PROD: ${{ vars.AWS_ACCOUNT_ID_PROD }}

      - name: Get Stack Outputs
        id: get-outputs
        run: |
          # Get ALB DNS
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name MonitoringEcsStack-${{ inputs.environment }} \
            --query 'Stacks[0].Outputs[?OutputKey==`MonitoringAlbDns`].OutputValue' \
            --output text 2>/dev/null || echo "")
          echo "alb-dns=$ALB_DNS" >> $GITHUB_OUTPUT

          # Get cluster name
          CLUSTER_NAME=$(aws cloudformation describe-stacks \
            --stack-name MonitoringEcsStack-${{ inputs.environment }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ClusterName`].OutputValue' \
            --output text 2>/dev/null || echo "${{ inputs.environment }}-monitoring-cluster")
          echo "cluster-name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

          # Get instance ID
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=${{ inputs.environment }}" \
                      "Name=tag:Purpose,Values=Monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text 2>/dev/null || echo "")
          echo "instance-id=$INSTANCE_ID" >> $GITHUB_OUTPUT

          echo "ALB DNS: $ALB_DNS"
          echo "Cluster: $CLUSTER_NAME"
          echo "Instance: $INSTANCE_ID"

      - name: Wait for Services to Stabilize
        run: |
          echo "Waiting for ECS services to stabilize..."
          CLUSTER="${{ steps.get-outputs.outputs.cluster-name }}"

          for SERVICE in ${{ inputs.environment }}-prometheus ${{ inputs.environment }}-grafana; do
            echo "Waiting for $SERVICE..."
            aws ecs wait services-stable \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --no-cli-pager || echo "Service $SERVICE not found or timeout"
          done

          echo "✓ Services stabilized"
