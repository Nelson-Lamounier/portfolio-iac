# @format
# Reusable workflow for setting up VPC peering

name: Setup VPC Peering

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (pipeline)"
        required: true
        type: string

env:
  AWS_REGION: eu-west-1
  NODE_VERSION: "22"

jobs:
  setup-peering:
    name: Setup VPC Peering
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: make install

      - name: Build Infrastructure
        run: make build-infrastructure

      - name: Configure AWS Credentials (Pipeline)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Pipeline VPC Info
        id: pipeline-vpc
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Environment,Values=${{ inputs.environment }}" \
            --query 'Vpcs[0].VpcId' \
            --output text)

          CIDR=$(aws ec2 describe-vpcs \
            --vpc-ids "$VPC_ID" \
            --query 'Vpcs[0].CidrBlock' \
            --output text)

          echo "vpc-id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "cidr=$CIDR" >> $GITHUB_OUTPUT

          echo "Pipeline VPC: $VPC_ID ($CIDR)"

      - name: Configure AWS Credentials (Development)
        if: vars.AWS_ACCOUNT_ID_DEV != '' && secrets.DEV_DEPLOYMENT_ROLE != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Get Development VPC Info
        id: dev-vpc
        if: vars.AWS_ACCOUNT_ID_DEV != ''
        continue-on-error: true
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Environment,Values=development" \
            --query 'Vpcs[0].VpcId' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$VPC_ID" != "NOT_FOUND" ] && [ "$VPC_ID" != "None" ]; then
            CIDR=$(aws ec2 describe-vpcs \
              --vpc-ids "$VPC_ID" \
              --query 'Vpcs[0].CidrBlock' \
              --output text)
            
            echo "vpc-id=$VPC_ID" >> $GITHUB_OUTPUT
            echo "cidr=$CIDR" >> $GITHUB_OUTPUT
            
            echo "Development VPC: $VPC_ID ($CIDR)"
          else
            echo "vpc-id=NOT_FOUND" >> $GITHUB_OUTPUT
            echo "Development VPC not found"
          fi

      - name: Switch Back to Pipeline Account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy VPC Peering Stack
        if: steps.dev-vpc.outputs.vpc-id != 'NOT_FOUND'
        run: make deploy-vpc-peering
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ vars.AWS_PIPELINE_ACCOUNT_ID }}
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}
          DEV_VPC_ID: ${{ steps.dev-vpc.outputs.vpc-id }}

      - name: Verify Peering Connection
        if: steps.dev-vpc.outputs.vpc-id != 'NOT_FOUND'
        run: |
          echo "Verifying VPC peering connection..."

          aws ec2 describe-vpc-peering-connections \
            --filters "Name=status-code,Values=active,pending-acceptance" \
            --query 'VpcPeeringConnections[*].{ID:VpcPeeringConnectionId,Status:Status.Code,Requester:RequesterVpcInfo.VpcId,Accepter:AccepterVpcInfo.VpcId}' \
            --output table

      - name: Generate Summary
        if: always()
        run: |
          echo "## VPC Peering Setup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline VPC" >> $GITHUB_STEP_SUMMARY
          echo "- **VPC ID**: ${{ steps.pipeline-vpc.outputs.vpc-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CIDR**: ${{ steps.pipeline-vpc.outputs.cidr }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.dev-vpc.outputs.vpc-id }}" != "NOT_FOUND" ]; then
            echo "### Development VPC" >> $GITHUB_STEP_SUMMARY
            echo "- **VPC ID**: ${{ steps.dev-vpc.outputs.vpc-id }}" >> $GITHUB_STEP_SUMMARY
            echo "- **CIDR**: ${{ steps.dev-vpc.outputs.cidr }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ VPC Peering configured" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Development VPC not found - peering not configured" >> $GITHUB_STEP_SUMMARY
          fi
