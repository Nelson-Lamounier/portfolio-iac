# @format

name: Deploy Pipeline Monitoring

on:
  push:
    branches:
      - feature/testing-pipeline # Specific branch for monitoring work /
    # paths:
    #   # - "infrastructure/lib/stacks/monitoring/**"
    #   # - "infrastructure/config/**"
    #   # - "infrastructure/bin/app.ts"
    #   # - "monitoring/**"
    #   # - "scripts/monitoring/**"
    #   # - "scripts/deploy/pipeline-monitoring.sh"
    #   # - "Makefile"
    #   # - ".github/workflows/deploy-pipeline-monitoring.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        default: "deploy-all"
        options:
          - deploy-all
          - deploy-infra-only
          - deploy-services-only
          - deploy-vpc-peering
          - sync-config-only
          - destroy-all
      run_health_checks:
        description: "Run post-deployment health checks"
        required: false
        type: boolean
        default: true
      fix_grafana:
        description: "Automatically fix Grafana datasource"
        required: false
        type: boolean
        default: true

env:
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================================
  # JOB 1: Deploy Infrastructure (Networking, VPC Peering, ECS, EFS, ALB)
  # ============================================================================
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: pipeline
    if: |
      github.event.inputs.action == 'deploy-all' || 
      github.event.inputs.action == 'deploy-infra-only' ||
      github.event.inputs.action == '' ||
      github.event.inputs.action == null

    outputs:
      alb_dns: ${{ steps.deploy-infra.outputs.alb_dns }}
      efs_id: ${{ steps.deploy-infra.outputs.efs_id }}
      instance_id: ${{ steps.validate-userdata.outputs.instance_id }}
      efs_mounted: ${{ steps.validate-userdata.outputs.efs_mounted }}
      config_created: ${{ steps.validate-userdata.outputs.config_created }}

    env:
      ACTION: ${{ github.event.inputs.action || 'deploy-all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: make install

      - name: Build Infrastructure
        run: make build-infrastructure

      - name: Configure AWS Credentials (OIDC - Pipeline Account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region:
            ${{ env.AWS_REGION }}

            # Assume role in dev account to fetch monitoring info - test
      - name: Configure AWS Credentials (Dev Account)
        if: vars.AWS_ACCOUNT_ID_DEV != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubDeploymentRole
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          role-session-name: GitHubActions-FetchDevInfo

      - name: Get Dev Account Parameters
        id: dev-params
        run: |
          # Now query SSM in Dev account
          DEV_VPC_ID=$(aws ssm get-parameter \
          --name "/networking/development/vpc-id" \
          --query "Parameter.Value" \
          --output text)


          echo "vpc_id=$DEV_VPC_ID" >> $GITHUB_OUTPUT

      # Switch back to Pipeline Account
      - name: Configure AWS Credentials (OIDC - Pipeline Account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Continue with pipeline operations
      - name: Continue Pipeline Operations
        run: |
          echo "Back in Pipeline account"
          aws sts get-caller-identity

          echo "Dev VPC: ${{ steps.dev-params.outputs.vpc_id }}"
          echo "Dev Cluster: ${{ steps.dev-params.outputs.cluster_arn }}"

      # Check stack states and handle recovery if needed
      - name: Check CloudFormation Stack States
        run: |
          echo "Checking CloudFormation stack states..."

          # Check for common failed states that block deployment
          NETWORKING_STATUS=$(aws cloudformation describe-stacks \
            --stack-name NetworkingStack-pipeline \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          INFRA_STATUS=$(aws cloudformation describe-stacks \
            --stack-name MonitoringInfraStack-pipeline \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Current stack states:"
          echo "  NetworkingStack-pipeline: $NETWORKING_STATUS"
          echo "  MonitoringInfraStack-pipeline: $INFRA_STATUS"

          # Handle problematic states that need intervention
          if [ "$NETWORKING_STATUS" = "UPDATE_ROLLBACK_FAILED" ] || [ "$INFRA_STATUS" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Found stacks in UPDATE_ROLLBACK_FAILED state - running recovery"
            chmod +x ./scripts/monitoring/recover-failed-stacks.sh
            ./scripts/monitoring/recover-failed-stacks.sh
          elif [ "$NETWORKING_STATUS" = "UPDATE_ROLLBACK_IN_PROGRESS" ] || [ "$INFRA_STATUS" = "UPDATE_ROLLBACK_IN_PROGRESS" ]; then
            echo "Found stacks in UPDATE_ROLLBACK_IN_PROGRESS state - waiting for completion"
            chmod +x ./scripts/monitoring/recover-failed-stacks.sh
            ./scripts/monitoring/recover-failed-stacks.sh
          elif [ "$NETWORKING_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ] || [ "$INFRA_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then
            echo "Found stacks in UPDATE_ROLLBACK_COMPLETE state"
            echo "This is a stable state - stacks are ready for deployment"
            echo "No recovery needed - proceeding with normal deployment"
          else
            echo " All stacks are in deployable states - proceeding with deployment"
          fi
      # Deploy Networking Stack (with smart dependency management)
      - name: Deploy Networking Stack
        run: |
          cd infrastructure

          # Check networking stack state first
          NETWORKING_STATUS=$(aws cloudformation describe-stacks \
            --stack-name NetworkingStack-pipeline \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "NetworkingStack-pipeline status: $NETWORKING_STATUS"

          # Only proceed with networking deployment if needed
          if [ "$NETWORKING_STATUS" = "CREATE_COMPLETE" ] || [ "$NETWORKING_STATUS" = "UPDATE_COMPLETE" ]; then
            echo "NetworkingStack-pipeline is already in good state ($NETWORKING_STATUS)"
            echo "Skipping networking deployment to avoid unnecessary VPC Peering disruption"
            
            # Check if there are actual changes that need deployment
            echo "Checking for networking stack changes..."
            DIFF_OUTPUT=$(ENVIRONMENT=pipeline yarn cdk diff NetworkingStack-pipeline 2>&1 || echo "")
            
            if echo "$DIFF_OUTPUT" | grep -q "There were no differences"; then
              echo "No changes detected in NetworkingStack - skipping deployment"
              exit 0
            else
              echo "Changes detected in NetworkingStack - proceeding with deployment"
            fi
          fi

          # If we reach here, networking stack needs deployment
          echo "NetworkingStack-pipeline needs deployment..."

          # Check if VPC Peering exists and might block networking updates
          VPC_PEERING_EXISTS=$(aws cloudformation describe-stacks \
            --stack-name VpcPeeringStack-pipeline \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          VPC_PEERING_DESTROYED=false
          if [ "$VPC_PEERING_EXISTS" != "NOT_FOUND" ] && [ "$VPC_PEERING_EXISTS" != "DELETE_COMPLETE" ]; then
            echo "VPC Peering stack exists and may block networking updates"
            echo "Temporarily removing VPC Peering to allow networking updates..."
            
            # Temporarily destroy VPC peering to allow networking updates
            ENVIRONMENT=pipeline yarn cdk destroy VpcPeeringStack-pipeline --force 2>/dev/null || true
            VPC_PEERING_DESTROYED=true
            
            echo "VPC Peering stack removed - networking can now be updated safely"
          fi

          # Deploy networking stack
          echo "Deploying NetworkingStack-pipeline..."

          if [ "$NETWORKING_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then
            echo "Stack is in UPDATE_ROLLBACK_COMPLETE state - deploying with --exclusively flag"
            ENVIRONMENT=pipeline yarn cdk deploy NetworkingStack-pipeline --require-approval never --exclusively
          else
            ENVIRONMENT=pipeline yarn cdk deploy NetworkingStack-pipeline --require-approval never
          fi

          echo "Networking stack deployed successfully"

          # Set flag for VPC Peering redeployment
          echo "VPC_PEERING_NEEDS_REDEPLOY=$VPC_PEERING_DESTROYED" >> $GITHUB_ENV
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ env.AWS_PIPELINE_ACCOUNT_ID }}

      # Deploy Layer 1: Infrastructure (ECS, EFS, ALB)
      - name: Deploy Layer 1 - Infrastructure
        id: deploy-infra
        run: |
          echo "Deploying MonitoringInfraStack-pipeline..."
          cd infrastructure

          # Check for failed stack state and handle recovery
          INFRA_STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name MonitoringInfraStack-pipeline \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$INFRA_STACK_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then
            echo "Infrastructure stack is in UPDATE_ROLLBACK_COMPLETE state"
            echo "This usually means a previous deployment failed due to resource conflicts"
            
            # Check for ALB resource conflicts (common cause of failures)
            echo "🔍 Checking for ALB resource conflicts..."
            ALB_EXISTS=$(aws elbv2 describe-load-balancers \
              --names "pipeline-monitoring-alb" \
              --query 'LoadBalancers[0].LoadBalancerArn' \
              --output text 2>/dev/null || echo "NOT_FOUND")
            
            if [ "$ALB_EXISTS" != "NOT_FOUND" ]; then
              echo "Found orphaned ALB resources - cleaning up..."
              chmod +x ./scripts/monitoring/cleanup-alb-resources.sh
              ENVIRONMENT=pipeline ./scripts/monitoring/cleanup-alb-resources.sh
              
              echo "ALB cleanup completed - waiting for AWS to process deletions..."
              sleep 60
            else
              echo "No ALB resource conflicts detected"
            fi
          fi

          # Skip certificate creation for monitoring - certificates cannot be used across accounts
          # The certificate from root account cannot be used in pipeline account
          echo "Disabling HTTPS for monitoring - cross-account certificate usage not supported"
          echo "Monitoring will be accessible via HTTP only"

          # Clear certificate environment variables to force HTTP-only mode
          unset CERTIFICATE_ARN
          unset ROOT_DOMAIN_NAME
          unset HOSTED_ZONE_ID
          echo "HTTPS_ENABLED=false" >> $GITHUB_ENV

          # Deploy infrastructure stack with certificate ARN
          echo "Attempting to deploy MonitoringInfraStack-pipeline..."

          if ! ENVIRONMENT=pipeline yarn cdk deploy MonitoringInfraStack-pipeline --require-approval never; then
            echo "Deployment failed - checking if this is a resource reference mismatch..."
            
            # Check if the error is about resources not found
            STACK_EVENTS=$(aws cloudformation describe-stack-events \
              --stack-name MonitoringInfraStack-pipeline \
              --query 'StackEvents[?ResourceStatus==`UPDATE_ROLLBACK_COMPLETE`] | [0].ResourceStatusReason' \
              --output text 2>/dev/null || echo "")
            
            if [[ "$STACK_EVENTS" == *"not found"* ]] || [[ "$STACK_EVENTS" == *"NotFound"* ]]; then
              echo "🔄 Detected resource reference mismatch - deleting and recreating stack..."
              
              # Delete the stack to clear invalid references
              ENVIRONMENT=pipeline yarn cdk destroy MonitoringInfraStack-pipeline --force 2>/dev/null || true
              
              echo "Waiting for stack deletion to complete..."
              sleep 60
              
              echo "Recreating MonitoringInfraStack-pipeline..."
              ENVIRONMENT=pipeline yarn cdk deploy MonitoringInfraStack-pipeline --require-approval never
            else
              echo "Deployment failed for a different reason - check CloudFormation console"
              exit 1
            fi
          fi

          echo "Getting stack outputs..."
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name MonitoringInfraStack-pipeline \
            --query 'Stacks[0].Outputs[?OutputKey==`LoadBalancerDns`].OutputValue' \
            --output text)

          EFS_ID=$(aws cloudformation describe-stacks \
            --stack-name MonitoringInfraStack-pipeline \
            --query 'Stacks[0].Outputs[?OutputKey==`EfsFileSystemId`].OutputValue' \
            --output text)

          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "efs_id=$EFS_ID" >> $GITHUB_OUTPUT
          echo "ALB DNS: $ALB_DNS"
          echo "EFS ID: $EFS_ID"

          # Log HTTP-only status for monitoring
          echo "ℹ️ Monitoring configured for HTTP-only access"
          echo "## 🌐 HTTP-Only Monitoring Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **HTTP URL**: http://$ALB_DNS" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason**: Cross-account certificate usage not supported" >> $GITHUB_STEP_SUMMARY
          echo "- **Security**: Internal monitoring network, HTTP acceptable" >> $GITHUB_STEP_SUMMARY
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ env.AWS_PIPELINE_ACCOUNT_ID }}
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}
          DEV_VPC_ID: ${{ env.DEV_VPC_ID }}
          # Certificate variables removed - monitoring uses HTTP only
          # Cross-account certificate usage is not supported by AWS

      # Wait for EC2 Instance and Validate UserData Execution
      - name: Validate EC2 Instance and UserData
        id: validate-userdata
        run: |
          echo "Waiting for EC2 instance to be ready..."

          # Wait up to 5 minutes for instance to appear
          for i in {1..30}; do
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Environment,Values=pipeline" \
                        "Name=instance-state-name,Values=running" \
              --query 'Reservations[0].Instances[0].InstanceId' \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
              echo "Instance found: $INSTANCE_ID"
              echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
              break
            fi
            
            echo "Waiting for instance... (attempt $i/30)"
            sleep 10
          done

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No EC2 instance found after 5 minutes"
            exit 1
          fi

          # Wait for SSM agent to be ready
          echo "Waiting for SSM agent to be ready..."

          # Wait for instance to appear in SSM
          for i in {1..30}; do
            SSM_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "NOT_FOUND")
            
            if [ "$SSM_STATUS" = "Online" ]; then
              echo "SSM agent is online"
              break
            fi
            
            echo "Waiting for SSM agent... (attempt $i/30, status: $SSM_STATUS)"
            sleep 10
          done

          if [ "$SSM_STATUS" != "Online" ]; then
            echo "::warning::SSM agent not online after 5 minutes, proceeding anyway"
          fi

          # Check UserData execution
          echo "Checking UserData execution..."

          if [ "$SSM_STATUS" = "Online" ]; then
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["echo \"=== UserData Execution Status ===\"","tail -50 /var/log/cloud-init-output.log","echo \"=== EFS Mount Status ===\"","df -h | grep efs || echo \"EFS not mounted\"","echo \"=== Directory Structure ===\"","ls -la /mnt/efs/ 2>/dev/null || echo \"EFS directory not accessible\"","echo \"=== Symlinks Status ===\"","ls -la /mnt/ | grep -E \"(prometheus|grafana)\" || echo \"Symlinks not created\""]' \
              --query 'Command.CommandId' \
              --output text 2>/dev/null || echo "FAILED")
          else
            echo "::warning::SSM agent not available, skipping UserData validation"
            COMMAND_ID="FAILED"
          fi

          if [ "$COMMAND_ID" != "FAILED" ]; then
            # Wait for command to complete
            sleep 15

            # Get command output
            OUTPUT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' \
              --output text 2>/dev/null || echo "Command execution failed")

            echo "UserData execution status:"
            echo "$OUTPUT"
          else
            echo "::warning::Could not execute SSM command, assuming UserData is running"
            OUTPUT="SSM command failed - assuming UserData is executing"
          fi

          # Check if EFS is mounted (with fallback)
          if [ "$COMMAND_ID" != "FAILED" ] && echo "$OUTPUT" | grep -q "efs"; then
            echo "✅ EFS is mounted successfully"
            echo "efs_mounted=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ EFS mount status unknown (will be validated later)"
            echo "efs_mounted=unknown" >> $GITHUB_OUTPUT
          fi

          # Check if config directories exist (with fallback)
          if [ "$COMMAND_ID" != "FAILED" ] && echo "$OUTPUT" | grep -q "prometheus"; then
            echo "✅ Config directories created"
            echo "config_created=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Config directory status unknown (will be validated later)"
            echo "config_created=unknown" >> $GITHUB_OUTPUT
          fi

      # Alternative validation using EC2 instance status
      - name: Alternative Instance Validation
        if: steps.validate-userdata.outputs.efs_mounted == 'unknown'
        run: |
          echo "Performing alternative instance validation..."
          INSTANCE_ID="${{ steps.validate-userdata.outputs.instance_id }}"

          # Check instance state
          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "Instance state: $INSTANCE_STATE"

          # If instance is running, assume UserData is executing
          if [ "$INSTANCE_STATE" = "running" ]; then
            echo "✅ Instance is running - UserData should be executing"
            echo "Waiting additional time for UserData to complete..."
            sleep 60
          else
            echo "⚠️ Instance is not in running state: $INSTANCE_STATE"
          fi

      # Fix EFS DNS Resolution Issue
      - name: Fix EFS DNS Resolution
        if: steps.validate-userdata.outputs.efs_mounted == 'false' || steps.validate-userdata.outputs.efs_mounted == 'unknown'
        run: |
          echo "EFS mount failed, attempting to fix DNS resolution issue..."
          INSTANCE_ID="${{ steps.validate-userdata.outputs.instance_id }}"
          EFS_ID="${{ steps.deploy-infra.outputs.efs_id }}"

          # Get EFS mount target IP
          MOUNT_TARGET_IP=$(aws efs describe-mount-targets \
            --file-system-id "$EFS_ID" \
            --query 'MountTargets[0].IpAddress' \
            --output text)

          echo "EFS Mount Target IP: $MOUNT_TARGET_IP"

          # Mount EFS using IP instead of DNS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo 'Mounting EFS using IP address...'\",\"sudo mkdir -p /mnt/efs\",\"sudo mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2 $MOUNT_TARGET_IP:/ /mnt/efs\",\"echo 'Creating directory structure...'\",\"sudo mkdir -p /mnt/efs/prometheus-data /mnt/efs/grafana-data\",\"sudo mkdir -p /mnt/efs/config/prometheus /mnt/efs/config/grafana/provisioning/datasources /mnt/efs/config/grafana/dashboards\",\"echo 'Creating symlinks...'\",\"sudo rm -rf /mnt/prometheus-data /mnt/grafana-data /mnt/prometheus-config /mnt/grafana-provisioning /mnt/grafana-dashboards\",\"sudo ln -sf /mnt/efs/prometheus-data /mnt/prometheus-data\",\"sudo ln -sf /mnt/efs/grafana-data /mnt/grafana-data\",\"sudo ln -sf /mnt/efs/config/prometheus /mnt/prometheus-config\",\"sudo ln -sf /mnt/efs/config/grafana/provisioning /mnt/grafana-provisioning\",\"sudo ln -sf /mnt/efs/config/grafana/dashboards /mnt/grafana-dashboards\",\"echo 'Setting permissions...'\",\"sudo chown -R 65534:65534 /mnt/efs/prometheus-data /mnt/efs/config/prometheus\",\"sudo chown -R 472:0 /mnt/efs/grafana-data /mnt/efs/config/grafana\",\"sudo chmod -R 777 /mnt/efs/prometheus-data /mnt/efs/grafana-data\",\"sudo chmod -R 755 /mnt/efs/config/prometheus /mnt/efs/config/grafana\",\"echo 'EFS setup completed'\",\"df -h | grep efs\"]" \
            --query 'Command.CommandId' \
            --output text)

          sleep 20

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text)

          echo "EFS fix output:"
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "efs"; then
            echo "✅ EFS mounted successfully using IP address"
          else
            echo "❌ EFS mount still failed"
            exit 1
          fi

      # Deploy Layer 2: Services (Prometheus, Grafana, Node Exporter)
      - name: Deploy Layer 2 - Services
        id: deploy-services
        run: |
          echo "Deploying MonitoringServiceStack-pipeline..."
          cd infrastructure
          ENVIRONMENT=pipeline yarn cdk deploy MonitoringServiceStack-pipeline --require-approval never

          echo "Services deployed successfully"
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ env.AWS_PIPELINE_ACCOUNT_ID }}

      # Initialize Configuration
      - name: Initialize Configuration
        run: |
          echo "Initializing monitoring configuration..."
          chmod +x ./scripts/monitoring/init-config.sh
          ./scripts/monitoring/init-config.sh --env pipeline
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ env.AWS_PIPELINE_ACCOUNT_ID }}

      # Wait for Services to Stabilize
      - name: Wait for Services to Stabilize
        run: |
          echo "Waiting for services to stabilize..."
          sleep 60

          CLUSTER="pipeline-monitoring-cluster"

          for SERVICE in pipeline-prometheus pipeline-grafana pipeline-monitoring-node-exporter; do
            echo "Checking $SERVICE..."
            
            # Wait for service to be stable
            aws ecs wait services-stable \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --max-attempts 20 \
              --delay 15 || echo "Service $SERVICE may not be fully stable yet"
            
            # Check final status
            RUNNING=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].runningCount' \
              --output text 2>/dev/null || echo "0")
            
            DESIRED=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].desiredCount' \
              --output text 2>/dev/null || echo "0")
            
            echo "$SERVICE: $RUNNING/$DESIRED tasks running"
          done

  # ============================================================================
  # JOB 2: Deploy Services (Prometheus, Grafana, Node Exporter)
  # ============================================================================
  deploy-services:
    name: Deploy Services
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    environment: pipeline
    if: |
      always() &&
      needs.deploy-infrastructure.result == 'success' &&
      (github.event.inputs.action == 'deploy-all' || 
       github.event.inputs.action == 'deploy-services-only' ||
       github.event.inputs.action == '' ||
       github.event.inputs.action == null)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: make install

      - name: Build Infrastructure
        run: make build-infrastructure

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Domain configuration is fetched from SSM parameters automatically by CDK

      # Deploy Layer 2: Services
      - name: Deploy Services Stack
        run: |
          echo "Deploying MonitoringServiceStack-pipeline..."
          cd infrastructure
          ENVIRONMENT=pipeline yarn cdk deploy MonitoringServiceStack-pipeline --require-approval never
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ env.AWS_PIPELINE_ACCOUNT_ID }}
          ROOT_DOMAIN_NAME: ${{ vars.ROOT_DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}

      # Initialize Configuration
      - name: Initialize Configuration
        run: |
          echo "Initializing monitoring configuration..."
          chmod +x ./scripts/monitoring/init-config.sh
          ./scripts/monitoring/init-config.sh --env pipeline

      # Wait for Services to Stabilize
      - name: Wait for Services to Stabilize
        run: |
          echo "Waiting for services to stabilize..."
          sleep 60

          CLUSTER="pipeline-monitoring-cluster"

          for SERVICE in pipeline-prometheus pipeline-grafana pipeline-monitoring-node-exporter; do
            echo "Checking $SERVICE..."
            
            # Wait for service to be stable
            aws ecs wait services-stable \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --max-attempts 20 \
              --delay 15 || echo "Service $SERVICE may not be fully stable yet"
            
            # Check final status
            RUNNING=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].runningCount' \
              --output text 2>/dev/null || echo "0")
            
            DESIRED=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].desiredCount' \
              --output text 2>/dev/null || echo "0")
            
            echo "$SERVICE: $RUNNING/$DESIRED tasks running"
          done
