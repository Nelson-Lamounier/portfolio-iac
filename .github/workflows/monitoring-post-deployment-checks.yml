# @format
# Reusable workflow for post-deployment checks and troubleshooting

name: Post-Deployment Checks

on:
  push:
    branches:
      - feature/monitoring # Specific branch for monitoring work
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string
      instance-id:
        description: "EC2 instance ID"
        required: true
        type: string
      alb-dns:
        description: "ALB DNS name"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  health-checks:
    name: Health Checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Instance Status
        id: instance-check
        run: |
          echo "Checking instance ${{ inputs.instance-id }}..."

          STATUS=$(aws ec2 describe-instances \
            --instance-ids ${{ inputs.instance-id }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Instance status: $STATUS"

          if [ "$STATUS" != "running" ]; then
            echo "::error::Instance is not running"
            exit 1
          fi

      - name: Check ECS Services
        id: ecs-check
        run: |
          CLUSTER="${{ inputs.environment }}-monitoring-cluster"

          echo "Checking ECS services in $CLUSTER..."

          SERVICES=$(aws ecs list-services \
            --cluster "$CLUSTER" \
            --query 'serviceArns' \
            --output text)

          if [ -z "$SERVICES" ]; then
            echo "::warning::No services found in cluster"
            echo "services-healthy=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check each service
          ALL_HEALTHY=true
          for SERVICE_ARN in $SERVICES; do
            SERVICE_NAME=$(basename $SERVICE_ARN)
            
            RUNNING=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE_ARN" \
              --query 'services[0].runningCount' \
              --output text)
            
            DESIRED=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE_ARN" \
              --query 'services[0].desiredCount' \
              --output text)
            
            echo "$SERVICE_NAME: $RUNNING/$DESIRED running"
            
            if [ "$RUNNING" != "$DESIRED" ]; then
              ALL_HEALTHY=false
            fi
          done

          echo "services-healthy=$ALL_HEALTHY" >> $GITHUB_OUTPUT

      - name: Check Container Health
        run: |
          chmod +x ./scripts/monitoring/check-monitoring-instance.sh
          ENVIRONMENT=${{ inputs.environment }} ./scripts/monitoring/check-monitoring-instance.sh

      - name: Test Prometheus Endpoint
        id: prometheus-check
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.alb-dns }}" ]; then
            echo "Testing Prometheus at http://${{ inputs.alb-dns }}/prometheus"
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ inputs.alb-dns }}/prometheus/-/healthy" || echo "000")
            
            echo "http-code=$HTTP_CODE" >> $GITHUB_OUTPUT
            echo "Prometheus health check: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Prometheus is healthy"
            else
              echo "::warning::Prometheus health check failed with code $HTTP_CODE"
            fi
          else
            echo "::warning::ALB DNS not available"
          fi

      - name: Test Grafana Endpoint
        id: grafana-check
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.alb-dns }}" ]; then
            echo "Testing Grafana at http://${{ inputs.alb-dns }}/grafana"
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ inputs.alb-dns }}/grafana/api/health" || echo "000")
            
            echo "http-code=$HTTP_CODE" >> $GITHUB_OUTPUT
            echo "Grafana health check: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Grafana is healthy"
            else
              echo "::warning::Grafana health check failed with code $HTTP_CODE"
            fi
          fi

      - name: Generate Health Report
        if: always()
        run: |
          echo "## Health Check Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Instance Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance ID**: ${{ inputs.instance-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.instance-check.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ECS Services" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.ecs-check.outputs.services-healthy }}" = "true" ]; then
            echo "✅ All services healthy" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some services not healthy" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Endpoints" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.prometheus-check.outputs.http-code }}" = "200" ]; then
            echo "- ✅ Prometheus: http://${{ inputs.alb-dns }}/prometheus" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Prometheus: Not responding (HTTP ${{ steps.prometheus-check.outputs.http-code }})" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.grafana-check.outputs.http-code }}" = "200" ]; then
            echo "- ✅ Grafana: http://${{ inputs.alb-dns }}/grafana" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Grafana: Not responding (HTTP ${{ steps.grafana-check.outputs.http-code }})" >> $GITHUB_STEP_SUMMARY
          fi

  diagnose-issues:
    name: Diagnose Issues
    runs-on: ubuntu-latest
    needs: health-checks
    if: always()
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Collect Container Logs
        run: |
          INSTANCE_ID="${{ inputs.instance-id }}"

          echo "Collecting logs from $INSTANCE_ID..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo \"=== Prometheus Logs (last 100 lines) ===\"",
              "docker logs prometheus --tail 100 2>&1 || echo \"Prometheus not running\"",
              "echo \"\"",
              "",
              "echo \"=== Grafana Logs (last 100 lines) ===\"",
              "docker logs grafana --tail 100 2>&1 || echo \"Grafana not running\"",
              "echo \"\"",
              "",
              "echo \"=== Node Exporter Logs (last 50 lines) ===\"",
              "docker logs node-exporter --tail 50 2>&1 || echo \"Node Exporter not running\"",
              "echo \"\"",
              "",
              "echo \"=== ECS Agent Logs (last 50 lines) ===\"",
              "journalctl -u ecs -n 50 --no-pager",
              "echo \"\"",
              "",
              "echo \"=== Setup Log (last 100 lines) ===\"",
              "tail -100 /var/log/monitoring-setup.log 2>/dev/null || echo \"Setup log not found\"",
              "echo \"\"",
              "",
              "echo \"=== Cloud-Init Log (errors only) ===\"",
              "grep -i error /var/log/cloud-init-output.log | tail -50 || echo \"No errors found\""
            ]' \
            --query 'Command.CommandId' \
            --output text)

          sleep 10

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text > /tmp/container-logs.txt

          echo "## Container Logs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 /tmp/container-logs.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Diagnose Grafana Datasource
        continue-on-error: true
        run: |
          chmod +x ./scripts/monitoring/diagnose-grafana-datasource.sh
          ENVIRONMENT=${{ inputs.environment }} ./scripts/monitoring/diagnose-grafana-datasource.sh
