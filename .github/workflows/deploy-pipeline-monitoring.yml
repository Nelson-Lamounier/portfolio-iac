# @format

name: Deploy Pipeline Monitoring

on:
  push:
    branches:
      - feature/*
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - deploy-all
          - deploy-infra-only
          - deploy-services-only
          - sync-config-only
          - destroy-all
      architecture:
        description: "Monitoring architecture"
        required: true
        type: choice
        default: "layered"
        options:
          - layered
          - embedded

env:
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: ${{ github.event.inputs.action }} (${{ github.event.inputs.architecture }})
    runs-on: ubuntu-latest
    environment: pipeline
    concurrency:
      group: deploy-pipeline-monitoring
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: make install

      - name: Build Infrastructure
        run: make build-infrastructure

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Get Dev account info for cross-account monitoring
      - name: Get Dev Account Info
        id: dev-info
        continue-on-error: true
        run: |
          # Get dev VPC ID from SSM
          DEV_VPC_ID=$(aws ssm get-parameter \
            --name "/networking/development/vpc-id" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "")

          if [ -n "$DEV_VPC_ID" ]; then
            echo "DEV_VPC_ID=$DEV_VPC_ID" >> $GITHUB_ENV
          fi

          # Get dev EC2 private IP
          DEV_IP=$(aws ssm get-parameter \
            --name "/compute/development/ec2-private-ip" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "")

          if [ -n "$DEV_IP" ]; then
            echo "DEV_NODE_EXPORTER_IP=$DEV_IP" >> $GITHUB_ENV
          fi

      # Deploy All
      - name: Deploy All (Layered)
        if: github.event.inputs.action == 'deploy-all' && github.event.inputs.architecture == 'layered'
        run: make deploy-monitoring-layered
        env:
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}

      - name: Deploy All (Embedded)
        if: github.event.inputs.action == 'deploy-all' && github.event.inputs.architecture == 'embedded'
        run: make deploy-monitoring-embedded
        env:
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}

      # Deploy Infrastructure Only
      - name: Deploy Infrastructure Only
        if: github.event.inputs.action == 'deploy-infra-only'
        run: make deploy-monitoring-infra

      # Deploy Services Only
      - name: Deploy Services Only
        if: github.event.inputs.action == 'deploy-services-only'
        run: make deploy-monitoring-services

      # Sync Config Only
      - name: Sync Config Only
        if: github.event.inputs.action == 'sync-config-only'
        run: make sync-monitoring-config

      # Destroy All
      - name: Destroy All
        if: github.event.inputs.action == 'destroy-all'
        run: make destroy-monitoring-layered

      # Check Status
      - name: Check Monitoring Status
        if: github.event.inputs.action != 'destroy-all'
        run: make check-monitoring-layered

      # Summary
      - name: Generate Summary
        if: always()
        run: |
          echo "## Pipeline Monitoring - ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** ${{ github.event.inputs.architecture }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.action }}" != "destroy-all" ]; then
            # Get ALB DNS
            ALB_DNS=$(aws cloudformation describe-stacks \
              --stack-name MonitoringInfraStack-pipeline \
              --query 'Stacks[0].Outputs[?OutputKey==`LoadBalancerDns`].OutputValue' \
              --output text 2>/dev/null || \
              aws cloudformation describe-stacks \
              --stack-name MonitoringEcsStack-pipeline \
              --query 'Stacks[0].Outputs[?OutputKey==`MonitoringAlbDns`].OutputValue' \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$ALB_DNS" ]; then
              echo "### Access URLs" >> $GITHUB_STEP_SUMMARY
              echo "- **Grafana**: http://${ALB_DNS}/grafana (admin/admin)" >> $GITHUB_STEP_SUMMARY
              echo "- **Prometheus**: http://${ALB_DNS}/prometheus" >> $GITHUB_STEP_SUMMARY
              echo "- **Targets**: http://${ALB_DNS}/prometheus/targets" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "✓ All monitoring stacks destroyed" >> $GITHUB_STEP_SUMMARY
          fi
