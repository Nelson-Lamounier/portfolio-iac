# @format

name: Deploy Pipeline Monitoring

on:
  push:
    branches:
      - feature/monitoring # Specific branch for monitoring work
    paths:
      - "infrastructure/lib/stacks/monitoring/**"
      - "infrastructure/config/**"
      - "infrastructure/bin/app.ts"
      - "monitoring/**"
      - "scripts/monitoring/**"
      - "scripts/deploy/pipeline-monitoring.sh"
      - "Makefile"
      - ".github/workflows/deploy-pipeline-monitoring.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        default: "deploy-all"
        options:
          - deploy-all
          - deploy-infra-only
          - deploy-services-only
          - deploy-vpc-peering
          - sync-config-only
          - destroy-all
      architecture:
        description: "Monitoring architecture"
        required: true
        type: choice
        default: "layered"
        options:
          - layered
          - embedded
      run_health_checks:
        description: "Run post-deployment health checks"
        required: false
        type: boolean
        default: true
      fix_grafana:
        description: "Automatically fix Grafana datasource"
        required: false
        type: boolean
        default: true

env:
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: ${{ github.event.inputs.action || 'deploy-all' }} (${{ github.event.inputs.architecture || 'layered' }})
    runs-on: ubuntu-latest
    environment: pipeline
    concurrency:
      group: deploy-pipeline-monitoring
      cancel-in-progress: false

    env:
      # Default values for push triggers (workflow_dispatch will override via inputs)
      ACTION: ${{ github.event.inputs.action || 'deploy-all' }}
      ARCHITECTURE: ${{ github.event.inputs.architecture || 'layered' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: make install

      - name: Build Infrastructure
        run: make build-infrastructure

      - name: Configure AWS Credentials (OIDC - Pipeline Account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Assume role in dev account to fetch monitoring info
      - name: Configure AWS Credentials (Dev Account)
        if: vars.AWS_ACCOUNT_ID_DEV != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubDeploymentRole
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          role-session-name: GitHubActions-FetchDevInfo

      # Fetch Dev Account Info using Makefile
      # Note: This may return NOT_FOUND if dev infrastructure isn't deployed yet
      # That's OK - monitoring can be deployed without cross-account access initially
      - name: Fetch Dev Account Monitoring Info
        id: dev-info
        if: vars.AWS_ACCOUNT_ID_DEV != ''
        continue-on-error: true
        run: |
          echo "::notice::Fetching dev account info (may be empty if not deployed yet)"
          echo "Current AWS Account:"
          aws sts get-caller-identity
          echo ""
          echo "Testing SSM access:"
          aws ssm get-parameter --name /networking/development/vpc-id --query 'Parameter.Value' --output text || echo "Cannot access SSM parameter"
          echo ""
          make fetch-monitoring-info ENV=development
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      # Switch back to pipeline account for deployment
      - name: Configure AWS Credentials (Pipeline Account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Fetch Staging Account Info (if needed)
      - name: Configure AWS Credentials (Staging Account)
        if: vars.AWS_ACCOUNT_ID_STAGING != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_STAGING }}:role/GitHubDeploymentRole
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Fetch Staging Account Monitoring Info
        id: staging-info
        if: vars.AWS_ACCOUNT_ID_STAGING != ''
        continue-on-error: true
        run: make fetch-monitoring-info ENV=staging
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      # Switch back to pipeline account for deployment
      - name: Configure AWS Credentials (Pipeline Account - Final)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy All
      - name: Deploy All (Layered)
        if: env.ACTION == 'deploy-all' && env.ARCHITECTURE == 'layered'
        run: make deploy-monitoring-layered
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ vars.AWS_PIPELINE_ACCOUNT_ID }}
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}
          AWS_ACCOUNT_ID_STAGING: ${{ vars.AWS_ACCOUNT_ID_STAGING }}
          AWS_ACCOUNT_ID_PROD: ${{ vars.AWS_ACCOUNT_ID_PROD }}
          DEV_VPC_ID: ${{ env.DEV_VPC_ID }}
          DEV_NODE_EXPORTER_IP: ${{ env.DEV_NODE_EXPORTER_IP }}

      - name: Deploy All (Embedded)
        if: env.ACTION == 'deploy-all' && env.ARCHITECTURE == 'embedded'
        run: make deploy-monitoring-embedded
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ vars.AWS_PIPELINE_ACCOUNT_ID }}
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}
          AWS_ACCOUNT_ID_STAGING: ${{ vars.AWS_ACCOUNT_ID_STAGING }}
          AWS_ACCOUNT_ID_PROD: ${{ vars.AWS_ACCOUNT_ID_PROD }}
          DEV_VPC_ID: ${{ env.DEV_VPC_ID }}
          DEV_NODE_EXPORTER_IP: ${{ env.DEV_NODE_EXPORTER_IP }}

      # Deploy Infrastructure Only
      - name: Deploy Infrastructure Only
        if: env.ACTION == 'deploy-infra-only'
        run: make deploy-monitoring-infra
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ vars.AWS_PIPELINE_ACCOUNT_ID }}
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}
          AWS_ACCOUNT_ID_STAGING: ${{ vars.AWS_ACCOUNT_ID_STAGING }}
          AWS_ACCOUNT_ID_PROD: ${{ vars.AWS_ACCOUNT_ID_PROD }}
          DEV_VPC_ID: ${{ env.DEV_VPC_ID }}

      # Deploy VPC Peering
      - name: Deploy VPC Peering
        if: env.ACTION == 'deploy-vpc-peering'
        run: |
          cd infrastructure
          ENVIRONMENT=pipeline yarn cdk deploy VpcPeeringStack-pipeline --require-approval never
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ vars.AWS_PIPELINE_ACCOUNT_ID }}
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}
          AWS_ACCOUNT_ID_STAGING: ${{ vars.AWS_ACCOUNT_ID_STAGING }}
          AWS_ACCOUNT_ID_PROD: ${{ vars.AWS_ACCOUNT_ID_PROD }}
          DEV_VPC_ID: ${{ env.DEV_VPC_ID }}

      # Deploy Services Only
      - name: Deploy Services Only
        if: env.ACTION == 'deploy-services-only'
        run: make deploy-monitoring-services
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ vars.AWS_PIPELINE_ACCOUNT_ID }}

      # Sync Config Only
      - name: Sync Config Only
        if: env.ACTION == 'sync-config-only'
        run: make sync-monitoring-config
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ vars.AWS_PIPELINE_ACCOUNT_ID }}

      # Destroy All
      - name: Destroy All
        if: env.ACTION == 'destroy-all'
        run: make destroy-monitoring-layered
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ vars.AWS_PIPELINE_ACCOUNT_ID }}

      # Check Status
      - name: Check Monitoring Status
        if: env.ACTION != 'destroy-all'
        run: make check-monitoring-layered

      # Summary
      - name: Generate Summary
        if: always()
        run: |
          echo "## Pipeline Monitoring - ${ACTION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** ${ARCHITECTURE}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Cross-Account Info Retrieved" >> $GITHUB_STEP_SUMMARY
          echo "- **Dev VPC ID:** ${DEV_VPC_ID:-NOT_FOUND}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dev EC2 IP:** ${DEV_NODE_EXPORTER_IP:-NOT_FOUND}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${ACTION}" != "destroy-all" ]; then
            # Get ALB DNS
            ALB_DNS=$(aws cloudformation describe-stacks \
              --stack-name MonitoringInfraStack-pipeline \
              --query 'Stacks[0].Outputs[?OutputKey==`LoadBalancerDns`].OutputValue' \
              --output text 2>/dev/null || \
              aws cloudformation describe-stacks \
              --stack-name MonitoringEcsStack-pipeline \
              --query 'Stacks[0].Outputs[?OutputKey==`MonitoringAlbDns`].OutputValue' \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$ALB_DNS" ]; then
              echo "### Access URLs" >> $GITHUB_STEP_SUMMARY
              echo "- **Grafana**: http://${ALB_DNS}/grafana (admin/admin)" >> $GITHUB_STEP_SUMMARY
              echo "- **Prometheus**: http://${ALB_DNS}/prometheus" >> $GITHUB_STEP_SUMMARY
              echo "- **Targets**: http://${ALB_DNS}/prometheus/targets" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "✓ All monitoring stacks destroyed" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # POST-DEPLOYMENT: Health Checks
  # ============================================================================
  health-checks:
    name: Health Checks
    needs: deploy
    if: |
      always() && 
      needs.deploy.result == 'success' &&
      (github.event.inputs.run_health_checks != 'false') &&
      (github.event.inputs.action != 'destroy-all')
    runs-on: ubuntu-latest
    environment: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Stack Outputs
        id: outputs
        run: |
          # Try both stack names (layered vs embedded)
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name MonitoringInfraStack-pipeline \
            --query 'Stacks[0].Outputs[?OutputKey==`LoadBalancerDns`].OutputValue' \
            --output text 2>/dev/null || \
            aws cloudformation describe-stacks \
            --stack-name MonitoringEcsStack-pipeline \
            --query 'Stacks[0].Outputs[?OutputKey==`MonitoringAlbDns`].OutputValue' \
            --output text 2>/dev/null || echo "")
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=pipeline" \
                      "Name=tag:Purpose,Values=Monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text 2>/dev/null || echo "")
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

          echo "ALB DNS: $ALB_DNS"
          echo "Instance ID: $INSTANCE_ID"

      - name: Check Instance Status
        if: steps.outputs.outputs.instance_id != ''
        run: |
          echo "Checking instance ${{ steps.outputs.outputs.instance_id }}..."

          STATUS=$(aws ec2 describe-instances \
            --instance-ids ${{ steps.outputs.outputs.instance_id }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "Instance status: $STATUS"

          if [ "$STATUS" != "running" ]; then
            echo "::warning::Instance is not running"
          else
            echo "✅ Instance is running"
          fi

      - name: Check ECS Services
        run: |
          CLUSTER="pipeline-monitoring-cluster"

          echo "Checking ECS services in $CLUSTER..."

          for SERVICE in pipeline-prometheus pipeline-grafana; do
            RUNNING=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].runningCount' \
              --output text 2>/dev/null || echo "0")
            
            DESIRED=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].desiredCount' \
              --output text 2>/dev/null || echo "0")
            
            echo "$SERVICE: $RUNNING/$DESIRED running"
            
            if [ "$RUNNING" = "$DESIRED" ] && [ "$RUNNING" != "0" ]; then
              echo "✅ $SERVICE is healthy"
            else
              echo "::warning::$SERVICE is not healthy ($RUNNING/$DESIRED)"
            fi
          done

      - name: Test Prometheus Endpoint
        if: steps.outputs.outputs.alb_dns != ''
        continue-on-error: true
        run: |
          ALB_DNS="${{ steps.outputs.outputs.alb_dns }}"

          echo "Testing Prometheus at http://${ALB_DNS}/prometheus"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://${ALB_DNS}/prometheus/-/healthy" || echo "000")

          echo "Prometheus health check: HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Prometheus is healthy"
          else
            echo "::warning::Prometheus health check failed with code $HTTP_CODE"
          fi

      - name: Test Grafana Endpoint
        if: steps.outputs.outputs.alb_dns != ''
        continue-on-error: true
        run: |
          ALB_DNS="${{ steps.outputs.outputs.alb_dns }}"

          echo "Testing Grafana at http://${ALB_DNS}/grafana"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://${ALB_DNS}/grafana/api/health" || echo "000")

          echo "Grafana health check: HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Grafana is healthy"
          else
            echo "::warning::Grafana health check failed with code $HTTP_CODE"
          fi

      - name: Check Container Status
        if: steps.outputs.outputs.instance_id != ''
        continue-on-error: true
        run: |
          chmod +x ./scripts/monitoring/check-monitoring-instance.sh
          ENVIRONMENT=pipeline ./scripts/monitoring/check-monitoring-instance.sh

      - name: Generate Health Report
        if: always()
        run: |
          echo "## 🏥 Health Check Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ steps.outputs.outputs.instance_id }}" ]; then
            echo "- **Instance**: ${{ steps.outputs.outputs.instance_id }} ✅" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "${{ steps.outputs.outputs.alb_dns }}" ]; then
            echo "- **ALB**: ${{ steps.outputs.outputs.alb_dns }} ✅" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # POST-DEPLOYMENT: Fix Grafana Datasource
  # ============================================================================
  fix-grafana:
    name: Fix Grafana
    needs: [deploy, health-checks]
    if: |
      always() && 
      needs.deploy.result == 'success' &&
      (github.event.inputs.fix_grafana != 'false') &&
      (github.event.inputs.action != 'destroy-all')
    runs-on: ubuntu-latest
    environment: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Diagnose Grafana
        continue-on-error: true
        run: |
          chmod +x ./scripts/monitoring/diagnose-grafana-datasource.sh
          ENVIRONMENT=pipeline ./scripts/monitoring/diagnose-grafana-datasource.sh

      - name: Fix Grafana Datasource
        run: |
          chmod +x ./scripts/monitoring/fix-grafana-datasource.sh
          ENVIRONMENT=pipeline ./scripts/monitoring/fix-grafana-datasource.sh

      - name: Verify Grafana
        continue-on-error: true
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name MonitoringInfraStack-pipeline \
            --query 'Stacks[0].Outputs[?OutputKey==`LoadBalancerDns`].OutputValue' \
            --output text 2>/dev/null || \
            aws cloudformation describe-stacks \
            --stack-name MonitoringEcsStack-pipeline \
            --query 'Stacks[0].Outputs[?OutputKey==`MonitoringAlbDns`].OutputValue' \
            --output text 2>/dev/null || echo "")

          if [ -n "$ALB_DNS" ]; then
            echo "Testing Grafana after fix..."
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${ALB_DNS}/grafana/api/health" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Grafana is responding"
              echo "## ✅ Grafana Fixed" >> $GITHUB_STEP_SUMMARY
            else
              echo "::warning::Grafana still not responding (HTTP $HTTP_CODE)"
              echo "## ⚠️ Grafana Fix Incomplete" >> $GITHUB_STEP_SUMMARY
              echo "HTTP Code: $HTTP_CODE" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  # ============================================================================
  # POST-DEPLOYMENT: Setup VPC Peering
  # ============================================================================
  setup-vpc-peering:
    name: Setup VPC Peering
    needs: deploy
    if: |
      always() && 
      needs.deploy.result == 'success' &&
      (github.event.inputs.action == 'deploy-vpc-peering' || github.event.inputs.action == 'deploy-all' || github.event.inputs.action == '')
    runs-on: ubuntu-latest
    environment: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: make install

      - name: Build Infrastructure
        run: make build-infrastructure

      - name: Configure AWS Credentials (Pipeline)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Pipeline VPC Info
        id: pipeline-vpc
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Environment,Values=pipeline" \
            --query 'Vpcs[0].VpcId' \
            --output text)

          CIDR=$(aws ec2 describe-vpcs \
            --vpc-ids "$VPC_ID" \
            --query 'Vpcs[0].CidrBlock' \
            --output text)

          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "cidr=$CIDR" >> $GITHUB_OUTPUT

          echo "Pipeline VPC: $VPC_ID ($CIDR)"

      - name: Configure AWS Credentials (Development)
        if: vars.AWS_ACCOUNT_ID_DEV != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubDeploymentRole
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Get Development VPC Info
        id: dev-vpc
        if: vars.AWS_ACCOUNT_ID_DEV != ''
        continue-on-error: true
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Environment,Values=development" \
            --query 'Vpcs[0].VpcId' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$VPC_ID" != "NOT_FOUND" ] && [ "$VPC_ID" != "None" ]; then
            CIDR=$(aws ec2 describe-vpcs \
              --vpc-ids "$VPC_ID" \
              --query 'Vpcs[0].CidrBlock' \
              --output text)
            
            echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
            echo "cidr=$CIDR" >> $GITHUB_OUTPUT
            
            echo "Development VPC: $VPC_ID ($CIDR)"
          else
            echo "vpc_id=NOT_FOUND" >> $GITHUB_OUTPUT
            echo "Development VPC not found"
          fi

      - name: Switch Back to Pipeline Account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy VPC Peering Stack
        if: steps.dev-vpc.outputs.vpc_id != 'NOT_FOUND'
        run: make deploy-vpc-peering
        env:
          AWS_PIPELINE_ACCOUNT_ID: ${{ vars.AWS_PIPELINE_ACCOUNT_ID }}
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}
          DEV_VPC_ID: ${{ steps.dev-vpc.outputs.vpc_id }}

      - name: Verify Peering Connection
        if: steps.dev-vpc.outputs.vpc_id != 'NOT_FOUND'
        run: |
          echo "## VPC Peering Setup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Pipeline VPC**: ${{ steps.pipeline-vpc.outputs.vpc_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dev VPC**: ${{ steps.dev-vpc.outputs.vpc_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          aws ec2 describe-vpc-peering-connections \
            --filters "Name=status-code,Values=active,pending-acceptance" \
            --query 'VpcPeeringConnections[*].{ID:VpcPeeringConnectionId,Status:Status.Code}' \
            --output table

          echo "✅ VPC Peering configured" >> $GITHUB_STEP_SUMMARY
