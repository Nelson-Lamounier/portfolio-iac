# @format

name: Sync Monitoring Config

on:
  push:
    branches:
      - main
      - feature/monitoring/
    paths:
      - "monitoring/**"
      - ".github/workflows/sync-monitoring-config.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "pipeline"
        type: choice
        options:
          - pipeline
          - development
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

jobs:
  sync-config:
    name: Sync Config to ${{ github.event.inputs.environment || 'pipeline' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'pipeline' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Config Bucket Name
        id: get-bucket
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'pipeline' }}"

          # Get bucket name from CloudFormation exports
          BUCKET_NAME=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${ENVIRONMENT}-monitoring-config-bucket'].Value" \
            --output text)

          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" == "None" ]; then
            echo "Error: Config bucket not found for environment: $ENVIRONMENT"
            echo "Make sure MonitoringInfraStack is deployed with config bucket"
            exit 1
          fi

          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "Found config bucket: $BUCKET_NAME"

      - name: Upload Configs to S3
        run: |
          BUCKET="${{ steps.get-bucket.outputs.bucket_name }}"

          echo "Uploading monitoring configs to S3..."

          # Upload Prometheus configs
          aws s3 cp monitoring/prometheus/prometheus.yml "s3://${BUCKET}/prometheus/prometheus.yml"
          aws s3 cp monitoring/prometheus/alerts.yml "s3://${BUCKET}/prometheus/alerts.yml"

          # Upload Grafana provisioning configs
          aws s3 sync monitoring/grafana/provisioning/ "s3://${BUCKET}/grafana/provisioning/" \
            --exclude "*" --include "*.yml"

          # Upload Grafana dashboards
          aws s3 sync monitoring/grafana/dashboards/ "s3://${BUCKET}/grafana/dashboards/" \
            --exclude "*" --include "*.json"

          echo "✓ All configs uploaded to S3"

      - name: Trigger Lambda to Sync to EFS
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'pipeline' }}"

          # Get Lambda function name
          FUNCTION_NAME=$(aws lambda list-functions \
            --query "Functions[?starts_with(FunctionName, '${ENVIRONMENT}')  && contains(FunctionName, 'PrometheusAutoUpdate')].FunctionName" \
            --output text | head -n1)

          if [ -z "$FUNCTION_NAME" ]; then
            echo "Warning: Lambda function not found, falling back to direct sync"
            chmod +x ./scripts/monitoring/sync-config.sh
            ./scripts/monitoring/sync-config.sh --env "$ENVIRONMENT"
          else
            echo "Invoking Lambda: $FUNCTION_NAME"
            aws lambda invoke \
              --function-name "$FUNCTION_NAME" \
              --payload '{"source":"manual"}' \
              /tmp/lambda-response.json
            
            cat /tmp/lambda-response.json
            echo "✓ Lambda invoked successfully"
          fi

      - name: Generate Summary
        if: always()
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'pipeline' }}"

          echo "## ✅ Monitoring Config Synced" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Synced Configuration:" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Prometheus config (\`monitoring/prometheus/\`)" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Grafana dashboards (\`monitoring/grafana/dashboards/\`)" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Grafana provisioning (\`monitoring/grafana/provisioning/\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Prometheus config reloaded automatically" >> $GITHUB_STEP_SUMMARY
          echo "- Grafana dashboards will refresh within 10 seconds" >> $GITHUB_STEP_SUMMARY
          echo "- Check targets: \`http://<alb-dns>/prometheus/targets\`" >> $GITHUB_STEP_SUMMARY
