# @format

name: Deploy Monitoring (Complete)

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/lib/stacks/monitoring/**"
      - "infrastructure/config/**"
      - "monitoring/**"
      - ".github/workflows/monitoring/**"
      - ".github/workflows/deploy-monitoring-complete.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: "pipeline"
        options:
          - pipeline
          - development
      architecture:
        description: "Monitoring architecture"
        required: false
        type: choice
        default: "layered"
        options:
          - layered
          - embedded
      setup_vpc_peering:
        description: "Setup VPC peering"
        required: false
        type: boolean
        default: false
      sync_config:
        description: "Sync monitoring config"
        required: false
        type: boolean
        default: true
      run_diagnostics:
        description: "Run post-deployment diagnostics"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  # ============================================================================
  # STEP 1: Deploy Infrastructure
  # ============================================================================
  deploy-infrastructure:
    name: Deploy Infrastructure
    uses: ./.github/workflows/monitoring/deploy-infrastructure.yml
    with:
      environment: ${{ github.event.inputs.environment || 'pipeline' }}
      architecture: ${{ github.event.inputs.architecture || 'layered' }}
    secrets: inherit

  # ============================================================================
  # STEP 2: Post-Deployment Health Checks
  # ============================================================================
  health-checks:
    name: Health Checks
    needs: deploy-infrastructure
    if: always() && needs.deploy-infrastructure.result == 'success'
    uses: ./.github/workflows/monitoring/post-deployment-checks.yml
    with:
      environment: ${{ github.event.inputs.environment || 'pipeline' }}
      instance-id: ${{ needs.deploy-infrastructure.outputs.instance-id }}
      alb-dns: ${{ needs.deploy-infrastructure.outputs.alb-dns }}
    secrets: inherit

  # ============================================================================
  # STEP 3: Fix Grafana Datasource (if needed)
  # ============================================================================
  fix-grafana:
    name: Fix Grafana Datasource
    needs: [deploy-infrastructure, health-checks]
    if: always() && needs.deploy-infrastructure.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'pipeline' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fix Grafana Datasource
        run: |
          chmod +x ./scripts/monitoring/fix-grafana-datasource.sh
          ENVIRONMENT=${{ github.event.inputs.environment || 'pipeline' }} \
            ./scripts/monitoring/fix-grafana-datasource.sh

  # ============================================================================
  # STEP 4: Sync Monitoring Config
  # ============================================================================
  sync-config:
    name: Sync Config
    needs: [deploy-infrastructure, fix-grafana]
    if: |
      always() && 
      needs.deploy-infrastructure.result == 'success' &&
      (github.event.inputs.sync_config == 'true' || github.event.inputs.sync_config == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'pipeline' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Prometheus Config
        if: hashFiles('monitoring/prometheus/prometheus.yml') != ''
        run: |
          INSTANCE_ID="${{ needs.deploy-infrastructure.outputs.instance-id }}"

          echo "Syncing Prometheus configuration..."
          CONTENT=$(base64 monitoring/prometheus/prometheus.yml)

          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"echo '$CONTENT' | base64 -d > /mnt/prometheus-config/prometheus.yml\",
              \"chown 65534:65534 /mnt/prometheus-config/prometheus.yml\",
              \"chmod 644 /mnt/prometheus-config/prometheus.yml\",
              \"curl -X POST http://localhost:9090/prometheus/-/reload || echo 'Reload requested'\"
            ]" \
            --no-cli-pager

          echo "✓ Prometheus config synced"

      - name: Sync Grafana Dashboards
        if: hashFiles('monitoring/grafana/dashboards/*.json') != ''
        run: |
          INSTANCE_ID="${{ needs.deploy-infrastructure.outputs.instance-id }}"

          for file in monitoring/grafana/dashboards/*.json; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Syncing dashboard: $filename..."
              
              CONTENT=$(base64 "$file")
              
              aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=[
                  \"mkdir -p /mnt/grafana-dashboards\",
                  \"echo '$CONTENT' | base64 -d > /mnt/grafana-dashboards/$filename\",
                  \"chown 472:0 /mnt/grafana-dashboards/$filename\",
                  \"chmod 644 /mnt/grafana-dashboards/$filename\"
                ]" \
                --no-cli-pager
              
              echo "✓ $filename synced"
            fi
          done

  # ============================================================================
  # STEP 5: Setup VPC Peering (Optional)
  # ============================================================================
  setup-vpc-peering:
    name: Setup VPC Peering
    needs: deploy-infrastructure
    if: |
      always() && 
      needs.deploy-infrastructure.result == 'success' &&
      github.event.inputs.setup_vpc_peering == 'true'
    uses: ./.github/workflows/monitoring/setup-vpc-peering.yml
    with:
      environment: ${{ github.event.inputs.environment || 'pipeline' }}
    secrets: inherit

  # ============================================================================
  # STEP 6: Final Diagnostics
  # ============================================================================
  final-diagnostics:
    name: Final Diagnostics
    needs: [deploy-infrastructure, health-checks, fix-grafana, sync-config]
    if: |
      always() && 
      needs.deploy-infrastructure.result == 'success' &&
      (github.event.inputs.run_diagnostics == 'true' || github.event.inputs.run_diagnostics == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'pipeline' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Final Health Check
        run: |
          ALB_DNS="${{ needs.deploy-infrastructure.outputs.alb-dns }}"

          echo "========================================="
          echo "Final Health Check"
          echo "========================================="
          echo ""

          # Test Prometheus
          echo "Testing Prometheus..."
          PROM_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://${ALB_DNS}/prometheus/-/healthy" || echo "000")
          echo "Prometheus: $PROM_CODE"

          # Test Grafana
          echo "Testing Grafana..."
          GRAF_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://${ALB_DNS}/grafana/api/health" || echo "000")
          echo "Grafana: $GRAF_CODE"

          # Check Prometheus targets
          echo ""
          echo "Prometheus Targets:"
          curl -s "http://${ALB_DNS}/prometheus/api/v1/targets" | \
            python3 -c "import sys, json; data=json.load(sys.stdin); print(json.dumps(data['data']['activeTargets'], indent=2))" || \
            echo "Cannot fetch targets"

      - name: Generate Final Summary
        if: always()
        run: |
          echo "# 🎉 Monitoring Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'pipeline' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture**: ${{ github.event.inputs.architecture || 'layered' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance ID**: ${{ needs.deploy-infrastructure.outputs.instance-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: ${{ needs.deploy-infrastructure.outputs.cluster-name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Access URLs" >> $GITHUB_STEP_SUMMARY
          ALB_DNS="${{ needs.deploy-infrastructure.outputs.alb-dns }}"
          echo "- **Grafana**: http://${ALB_DNS}/grafana (admin/admin)" >> $GITHUB_STEP_SUMMARY
          echo "- **Prometheus**: http://${ALB_DNS}/prometheus" >> $GITHUB_STEP_SUMMARY
          echo "- **Targets**: http://${ALB_DNS}/prometheus/targets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Deployment Steps" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Infrastructure deployed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Health checks completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Grafana datasource fixed" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.sync_config }}" = "true" ] || [ -z "${{ github.event.inputs.sync_config }}" ]; then
            echo "- ✅ Configuration synced" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ github.event.inputs.setup_vpc_peering }}" = "true" ]; then
            echo "- ✅ VPC peering configured" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Open Grafana and verify datasource is working" >> $GITHUB_STEP_SUMMARY
          echo "2. Import Node Exporter dashboard (ID: 1860)" >> $GITHUB_STEP_SUMMARY
          echo "3. Create custom dashboards for your metrics" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.setup_vpc_peering }}" != "true" ]; then
            echo "4. Setup VPC peering for cross-account monitoring" >> $GITHUB_STEP_SUMMARY
          fi
